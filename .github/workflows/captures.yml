# Captures d'ecran et PDF pour la revue visuelle : sur chaque branche (sauf main),
# l'appli est ouverte dans un navigateur avec des donnees fictives ; les images sont
# publiees sur la branche « captures/<branche> » (aucune donnee reelle).
name: Captures

on:
  push:
    branches-ignore: [main, "captures/**"]

permissions:
  contents: write

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun add -d playwright@1.48.2 && bunx playwright install --with-deps chromium webkit && sudo apt-get install -y poppler-utils
      - name: Lancer l'appli et capturer
        run: |
          (bun run dev --port 8080 --host 127.0.0.1 > dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/ >/dev/null && break; sleep 2; done
          node e2e/captures.mjs out
          node e2e/tab.mjs out || true
          for f in out/*.pdf; do if [ -f "$f" ]; then pdftoppm -png -r 60 "$f" "${f%.pdf}-page"; fi; done
      - name: Publier sur la branche captures
        run: |
          cd out
          git init -q -b "captures/${GITHUB_REF_NAME}"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Captures de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/captures/${GITHUB_REF_NAME}"
